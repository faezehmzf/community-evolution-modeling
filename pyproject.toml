[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdmec-discovery"
version = "0.1.0"
description = "Read-only data-access verification, Phase 1 TDMEC contracts/schemas, Phase 2 privacy-safe diagnostics, Dataset A graph builders, embedding-stage code, and TDMEC model scaffolding."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
    "gdown>=5.1",
    "PyYAML>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
drive = [
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-httplib2>=0.2",
]
test = ["pytest>=8.0"]
# Optional Postgres + AGE + pgvector (Dataset A graph AGE sync / DB pilots).
db = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
# Model training (TDMEC-G / Full). Prefer the Studio torch install when present.
model = [
    "torch>=2.2",
]
# Target-Studio embedding stack. Do not install in the authoring Studio under the
# no-execution / no-model-download restriction. Pin/constraint file:
# requirements/embeddings-target-studio.txt
embeddings = [
    "torch>=2.2,<2.7",
    "transformers>=4.51,<5",
    "accelerate>=0.33,<2",
    "tokenizers>=0.19,<0.22",
    "safetensors>=0.4,<0.6",
    "huggingface_hub>=0.24,<0.30",
    "psutil>=5.9,<7",
]

[project.scripts]
tdmec-discovery = "tdmec_discovery.cli:main"
tdmec-diagnostics = "tdmec_diagnostics.cli:main"
tdmec-graph = "tdmec_graph.cli:main"
tdmec-db-migrate = "tdmec_db.migrate:main"
tdmec-embeddings-pilot = "tdmec_embeddings.cli:main"
tdmec-embedding-files = "tdmec_embeddings.file_cli:main"
tdmec-embedding-pilot-run = "tdmec_embeddings.run_pilot_embedding:main"
tdmec-assemble-smoke-e2e = "tdmec_embeddings.assemble_tdmec_input:main"
tdmec-train-g = "tdmec_model.train_g:main"
tdmec-train-full = "tdmec_model.train_full:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "tdmec*",
    "tdmec_discovery*",
    "tdmec_pilot*",
    "tdmec_diagnostics*",
    "tdmec_embeddings*",
    "tdmec_graph*",
    "tdmec_db*",
    "tdmec_model*",
]

[tool.setuptools.package-data]
tdmec_db = ["schema.sql", "*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
