[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdmec-discovery"
version = "0.1.0"
description = "Read-only data-access verification and forensic discovery tooling for TDMEC Dataset A / Dataset B."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
    "gdown>=5.1",
]

[project.optional-dependencies]
drive = [
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-httplib2>=0.2",
]
test = ["pytest>=8.0"]

[project.scripts]
tdmec-discovery = "tdmec_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
